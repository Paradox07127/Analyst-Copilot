<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EDA UI/UX 验收清单</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: light-dark(#f7f7f5, #151514);
        --surface: light-dark(#ffffff, #201f1d);
        --surface-strong: light-dark(#f0efec, #292824);
        --text: light-dark(#242321, #efeee9);
        --muted: light-dark(#716e67, #aaa49b);
        --border: light-dark(#ddd9d0, #3b3934);
        --accent: light-dark(#0f766e, #37b5aa);
        --accent-soft: light-dark(#d8f0ed, #153d39);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }

      main {
        width: min(100% - 32px, 1040px);
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 22px;
      }

      h1, h2, p { margin: 0; }
      h1 { font-size: clamp(1.4rem, 3vw, 2rem); letter-spacing: -0.02em; }
      h2 { font-size: 1rem; }
      .subtitle { margin-top: 6px; color: var(--muted); }

      .progress-panel {
        min-width: 220px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }

      .progress-label { display: flex; justify-content: space-between; gap: 16px; font-size: 0.875rem; }
      progress { width: 100%; height: 8px; margin-top: 9px; accent-color: var(--accent); }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }

      .hint { color: var(--muted); font-size: 0.875rem; }
      button {
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 7px 10px;
        background: var(--surface);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button:hover { background: var(--surface-strong); }

      .sections { display: grid; gap: 10px; }
      details {
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        overflow: clip;
      }
      summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        cursor: pointer;
        font-weight: 600;
      }
      summary::marker { color: var(--muted); }
      .section-progress { color: var(--muted); font-size: 0.8125rem; font-weight: 400; }
      .checks { display: grid; border-top: 1px solid var(--border); }
      .check {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 11px;
        padding: 11px 16px;
        border-top: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
        line-height: 1.45;
      }
      .check:first-child { border-top: 0; }
      .check:has(input:checked) { background: color-mix(in srgb, var(--accent-soft) 38%, transparent); }
      input[type="checkbox"] { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--accent); }
      label { cursor: pointer; }
      input:checked + label { color: var(--muted); text-decoration: line-through; }
      a { color: var(--accent); text-decoration: none; }
      a:hover { text-decoration: underline; }
      code { padding: 1px 4px; border-radius: 4px; background: var(--surface-strong); font-size: 0.9em; }

      @media (max-width: 560px) {
        main { width: min(100% - 20px, 1040px); padding-top: 18px; }
        header { align-items: stretch; }
        .progress-panel { width: 100%; }
        summary, .check { padding-left: 12px; padding-right: 12px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>EDA UI/UX 验收清单</h1>
          <p class="subtitle">逐项勾选；状态只保存在当前浏览器。</p>
        </div>
        <div class="progress-panel" aria-live="polite">
          <div class="progress-label"><span>总进度</span><strong id="overall-count">0 / 0</strong></div>
          <progress id="overall-progress" value="0" max="1"></progress>
        </div>
      </header>

      <div class="toolbar">
        <p class="hint">建议并排打开 <a href="/projects" target="_blank" rel="noreferrer">Home</a> 与对应 Session 页面。</p>
        <button type="button" id="reset">清除所有勾选</button>
      </div>

      <div class="sections">
        <details open data-section="global">
          <summary>全局框架、顶部与导航 <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="global-stage" type="checkbox" data-check><label for="global-stage">一级阶段导航默认只占一行；点击当前阶段才出现 1 / 2 / 3 的完整选择。</label></div>
            <div class="check"><input id="global-stage-layer" type="checkbox" data-check><label for="global-stage-layer">阶段浮层、顶部任务 Tooltip、Session 导航和页面内容之间没有错误遮挡。</label></div>
            <div class="check"><input id="global-job" type="checkbox" data-check><label for="global-job">顶部状态只显示聚焦 Session 的任务，含任务名、当前步骤、细分进度与完成/降级/失败状态。</label></div>
            <div class="check"><input id="global-model" type="checkbox" data-check><label for="global-model">LLM 状态只显示模型名，不重复 provider。</label></div>
            <div class="check"><input id="global-theme" type="checkbox" data-check><label for="global-theme">未手动设定主题时，白天/夜晚按本地时间切换；手动切换后能保持选择。</label></div>
            <div class="check"><input id="global-rail" type="checkbox" data-check><label for="global-rail">左侧边界是细可拖拽线；悬浮高亮并显示左右调整光标。</label></div>
            <div class="check"><input id="global-toast" type="checkbox" data-check><label for="global-toast">刷新或任务结束后，页面中间不再出现 <code>Analysis completed</code> 提示。</label></div>
          </div>
        </details>

        <details open data-section="home">
          <summary>Home <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="home-layout" type="checkbox" data-check><label for="home-layout"><a href="/projects" target="_blank" rel="noreferrer">Home</a> 顶部为 Overview 与 Recent work / Projects 的 50 / 50 布局。</label></div>
            <div class="check"><input id="home-typography" type="checkbox" data-check><label for="home-typography">Overview 指标文字清楚易读，完整标签不会在普通桌面宽度变成缩写。</label></div>
            <div class="check"><input id="home-activity-180" type="checkbox" data-check><label for="home-activity-180">180d 显示 180 个小格（约 26 周列），没有横向溢出。</label></div>
            <div class="check"><input id="home-activity-30" type="checkbox" data-check><label for="home-activity-30">30d 显示 30 个中等格（5 周列），不会出现撑满卡片的巨型方块。</label></div>
            <div class="check"><input id="home-activity-7" type="checkbox" data-check><label for="home-activity-7">7d 显示 7 个横向格；三个范围的日期数量与按钮一致。</label></div>
            <div class="check"><input id="home-recent" type="checkbox" data-check><label for="home-recent">Recent work 最多 6 条；Projects 保持紧凑，不重复展示 Recent work。</label></div>
            <div class="check"><input id="home-launch" type="checkbox" data-check><label for="home-launch">Start an analysis 位于 Home 底部并在滚动时保持可见。</label></div>
          </div>
        </details>

        <details data-section="new-session">
          <summary>New session <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="new-select-all" type="checkbox" data-check><label for="new-select-all">Select all / Clear selection 同时覆盖 Project 已存文件与本次上传文件。</label></div>
            <div class="check"><input id="new-upload" type="checkbox" data-check><label for="new-upload">上传区只保留一个 Choose CSV files 按钮；旧的拖放说明文字已移除。</label></div>
            <div class="check"><input id="new-scroll" type="checkbox" data-check><label for="new-scroll">大量文件时只有列表内部滚动，页面在常见屏幕高度内可用。</label></div>
            <div class="check"><input id="new-docs" type="checkbox" data-check><label for="new-docs">Add support docs 易发现，问号 Tooltip 不被容器裁切。</label></div>
            <div class="check"><input id="new-deselect" type="checkbox" data-check><label for="new-deselect">上传后取消勾选不会删除 Project 文件，只是不进入本次分析。</label></div>
            <div class="check"><input id="new-idempotency" type="checkbox" data-check><label for="new-idempotency">相同输入重复运行不会创建重复 Session；改变文件/上下文/清理设置后才创建新请求。</label></div>
          </div>
        </details>

        <details data-section="data-map-preview">
          <summary>Data Map 与 Table Preview <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="map-overview" type="checkbox" data-check><label for="map-overview">Data Map 顶部概览显示 Tables、Rows、Columns、Cleaned tables、Stored size。</label></div>
            <div class="check"><input id="map-row" type="checkbox" data-check><label for="map-row">每个 Dataset 行的信息集中且不重复，Preview / Review quality 可直接进入对应页面。</label></div>
            <div class="check"><input id="preview-sort" type="checkbox" data-check><label for="preview-sort">Table Preview 点击表头可升序/降序；未排序列显示 <code>↕</code>。</label></div>
            <div class="check"><input id="preview-page" type="checkbox" data-check><label for="preview-page">切换 Preview 分页后源数据行号连续，而非每页从 1 开始。</label></div>
            <div class="check"><input id="preview-bars" type="checkbox" data-check><label for="preview-bars">顶部柱状图悬浮范围覆盖柱子的纵向区域，短柱也容易触发。</label></div>
          </div>
        </details>

        <details data-section="quality">
          <summary>Quality <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="quality-dataset" type="checkbox" data-check><label for="quality-dataset">Dataset 选择器可在 All datasets 和单 Dataset 间切换，指标同步更新。</label></div>
            <div class="check"><input id="quality-metrics" type="checkbox" data-check><label for="quality-metrics">Critical、Warnings、Info、Affected datasets、Affected fields 的单位和数量清楚。</label></div>
            <div class="check"><input id="quality-filter" type="checkbox" data-check><label for="quality-filter">Severity 分段筛选与 Issue types 筛选可组合使用。</label></div>
            <div class="check"><input id="quality-empty" type="checkbox" data-check><label for="quality-empty">无匹配筛选时显示真实空状态，不会回退显示全部问题。</label></div>
            <div class="check"><input id="quality-density" type="checkbox" data-check><label for="quality-density">Quality 专注问题队列，不重复堆叠 Profile 的字段分布和诊断。</label></div>
          </div>
        </details>

        <details data-section="profiles-charts">
          <summary>Profiles & Charts <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="profiles-dataset" type="checkbox" data-check><label for="profiles-dataset">顶部 Dataset 下拉只聚焦一个文件；切换后 Overview、字段表和图表全部同步。</label></div>
            <div class="check"><input id="profiles-overview" type="checkbox" data-check><label for="profiles-overview">Rows、Columns、Null rate、Empty columns、Profiled fields、Analytical charts 的概览信息完整。</label></div>
            <div class="check"><input id="profiles-search" type="checkbox" data-check><label for="profiles-search">Find column 放大镜展开/收起正常，不挤压类型筛选。</label></div>
            <div class="check"><input id="profiles-table" type="checkbox" data-check><label for="profiles-table">Column / Type / Missing / Unique 表头可排序，数字与进度条对齐。</label></div>
            <div class="check"><input id="charts-view" type="checkbox" data-check><label for="charts-view">Profile / Charts 分段切换保留 Dataset；Charts 只显示当前 Dataset 的分析图。</label></div>
            <div class="check"><input id="charts-builder" type="checkbox" data-check><label for="charts-builder">Chart Builder 自动使用当前 Dataset，不出现第二个重复 Dataset 选择器。</label></div>
          </div>
        </details>

        <details data-section="cleanup">
          <summary>Cleanup <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="cleanup-url" type="checkbox" data-check><label for="cleanup-url">选择 Dataset 后刷新页面，URL 仍保留该 Dataset。</label></div>
            <div class="check"><input id="cleanup-steps" type="checkbox" data-check><label for="cleanup-steps">Suggested recipe → Preview changes → Confirm apply → Derived run 的流程顺序清楚。</label></div>
            <div class="check"><input id="cleanup-zero" type="checkbox" data-check><label for="cleanup-zero">取消所有操作时 Preview 禁用并给出提示。</label></div>
            <div class="check"><input id="cleanup-safe" type="checkbox" data-check><label for="cleanup-safe">Lossy 操作有标识，且页面明确说明不会覆盖原始文件。</label></div>
          </div>
        </details>

        <details data-section="relationships">
          <summary>Relationships <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="rel-metrics" type="checkbox" data-check><label for="rel-metrics">Datasets、Dataset pairs、Column candidates、Confirmed joins 的数量单位没有混淆。</label></div>
            <div class="check"><input id="rel-coverage" type="checkbox" data-check><label for="rel-coverage">Search coverage 清楚区分 evaluated、deferred 和 bounded。</label></div>
            <div class="check"><input id="rel-narrow" type="checkbox" data-check><label for="rel-narrow">打开 Inspector 的窄区中，关系图完整可达，候选队列在下方。</label></div>
            <div class="check"><input id="rel-wide" type="checkbox" data-check><label for="rel-wide">关闭 Inspector 的宽区中，图和候选队列为双栏，候选队列独立滚动。</label></div>
            <div class="check"><input id="rel-state" type="checkbox" data-check><label for="rel-state">Candidate / Validated / Confirmed 的状态和操作可理解。</label></div>
          </div>
        </details>

        <details data-section="knowledge-compare">
          <summary>Knowledge 与 Compare <span class="section-progress"></span></summary>
          <div class="checks">
            <div class="check"><input id="knowledge-overview" type="checkbox" data-check><label for="knowledge-overview">Knowledge 概览的 Session datasets、Field meanings、Definitions、Relations、Suggestions 数量准确。</label></div>
            <div class="check"><input id="knowledge-tabs" type="checkbox" data-check><label for="knowledge-tabs">Meanings review / Business definitions / Join policy 分段切换与 URL 恢复正常。</label></div>
            <div class="check"><input id="knowledge-project" type="checkbox" data-check><label for="knowledge-project">当前 Session 与 Project 其他 Dataset 的建议被清楚区分。</label></div>
            <div class="check"><input id="compare-shell" type="checkbox" data-check><label for="compare-shell">Compare 保留主 App Topbar、Session 导航与边栏，不打开脱离 Shell 的界面。</label></div>
            <div class="check"><input id="compare-focus" type="checkbox" data-check><label for="compare-focus">切换左右 pane 后，Inspector 与顶部 Session 状态跟随当前聚焦 pane。</label></div>
          </div>
        </details>
      </div>
    </main>

    <script>
      (() => {
        const storageKey = "eda-ui-ux-checklist-v1";
        const checks = [...document.querySelectorAll("[data-check]")];
        const overallCount = document.querySelector("#overall-count");
        const overallProgress = document.querySelector("#overall-progress");
        const saved = new Set(JSON.parse(localStorage.getItem(storageKey) || "[]"));

        for (const check of checks) {
          check.checked = saved.has(check.id);
          check.addEventListener("change", () => {
            const selected = checks.filter((item) => item.checked).map((item) => item.id);
            localStorage.setItem(storageKey, JSON.stringify(selected));
            updateProgress();
          });
        }

        document.querySelector("#reset").addEventListener("click", () => {
          if (!confirm("清除所有验收勾选？")) return;
          for (const check of checks) check.checked = false;
          localStorage.removeItem(storageKey);
          updateProgress();
        });

        function updateProgress() {
          const done = checks.filter((check) => check.checked).length;
          overallCount.textContent = `${done} / ${checks.length}`;
          overallProgress.max = checks.length || 1;
          overallProgress.value = done;
          document.querySelectorAll("[data-section]").forEach((section) => {
            const sectionChecks = [...section.querySelectorAll("[data-check]")];
            const sectionDone = sectionChecks.filter((check) => check.checked).length;
            section.querySelector(".section-progress").textContent = `${sectionDone} / ${sectionChecks.length}`;
          });
        }

        updateProgress();
      })();
    </script>
  </body>
</html>
