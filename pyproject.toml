[project]
name = "eda-agent-platform"
version = "0.2.0"
description = "Local-first EDA agent platform V2 foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.0",
    "fastapi>=0.115",
    "matplotlib==3.10.8",
    "pandas>=2.2.0",
    "pydantic>=2.10.0",
    "pypdf>=6.14.0,<7",
    "python-multipart>=0.0.20",
    "scikit-learn>=1.7.0",
    "scipy>=1.16.0",
    "uvicorn>=0.30",
    "vl-convert-python>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "httpx2>=2.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "weasyprint>=69",
]
pdf = [
    "weasyprint>=69",
]
observability = [
    "arize-phoenix>=11.0.0",
    "openinference-instrumentation>=0.1.0",
    "opentelemetry-sdk>=1.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["eda_platform/src"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["eda_platform/tests"]
pythonpath = ["eda_platform/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["eda_platform/src", "eda_platform/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["eda_platform/src", "eda_platform/tests"]
extraPaths = ["eda_platform/src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[dependency-groups]
dev = [
    "pytest-xdist>=3.8.0",
]
