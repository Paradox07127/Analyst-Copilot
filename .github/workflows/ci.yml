name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run pyright
      - run: docker build -t eda-agent-sandbox:py312 docker/eda-agent-sandbox
      - run: uv run pytest
      - run: .venv/bin/python scripts/demo_j1.py
      - run: .venv/bin/python scripts/demo_j3.py
